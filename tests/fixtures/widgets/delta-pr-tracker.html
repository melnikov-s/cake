<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delta PRs</title>
    <style>
      :root {
        --w-muted-fg: var(--muted-foreground, color-mix(in srgb, currentColor 62%, transparent));
        --w-success: var(--success, #2f9e5f);
        --w-attention: var(--attention, #c98a12);
        --w-destructive: var(--destructive, #d64545);
        --w-primary: var(--primary, #4a7bd6);
        --w-warning: var(--warning, #d9822b);
        /* Merge purple: a data color for "merging", mixed with the live foreground for contrast. */
        --w-merging: color-mix(in srgb, #8957e5 78%, var(--foreground));
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.4;
      }
      #app {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ring, var(--primary));
        outline-offset: 2px;
        border-radius: 4px;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        justify-content: space-between;
      }
      .ttl {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 8px;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }
      .sub {
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        min-width: 0;
      }
      .refreshed {
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: var(--primary-foreground);
        cursor: pointer;
        font-weight: 550;
      }
      .btn:hover:not(:disabled) {
        filter: brightness(1.08);
      }
      .btn:disabled {
        opacity: 0.7;
        cursor: default;
      }
      .spin {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 2px solid currentColor;
        border-right-color: transparent;
        animation: sp 0.8s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .inline-err {
        color: var(--destructive);
        font-size: 12px;
        flex-basis: 100%;
        text-align: right;
        overflow-wrap: anywhere;
      }

      .banner {
        border-radius: 6px;
        padding: 8px 10px;
        overflow-wrap: anywhere;
      }
      .banner.err {
        border: 1px solid color-mix(in srgb, var(--destructive) 45%, transparent);
        background: color-mix(in srgb, var(--destructive) 12%, transparent);
      }
      .banner.err strong {
        color: var(--destructive);
      }
      .banner .note {
        color: var(--muted-foreground);
        font-size: 12px;
        margin-top: 2px;
      }
      .banner.warn {
        border: 1px solid color-mix(in srgb, var(--attention) 40%, transparent);
        background: color-mix(in srgb, var(--attention) 10%, transparent);
        font-size: 12px;
      }
      .banner.warn ul {
        margin: 0;
        padding-left: 16px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        --c: var(--muted-foreground);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--foreground);
        cursor: pointer;
        font-size: 12px;
      }
      .chip:hover {
        background: var(--muted);
      }
      .chip .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--c);
        flex: none;
      }
      .chip .n {
        font-family: var(--font-mono);
        font-weight: 650;
      }
      .chip.zero {
        color: var(--muted-foreground);
      }

      .sep {
        margin: 4px 0 -2px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted-foreground);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sep::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--border);
      }

      section {
        --c: var(--muted-foreground);
        border: 1px solid var(--border);
        border-left: 3px solid var(--c);
        border-radius: 6px;
        background: var(--card);
        color: var(--card-foreground);
        min-width: 0;
        overflow: hidden;
        scroll-margin-top: 8px;
      }
      section h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 650;
        padding: 7px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      section h2 .n {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, transparent);
        padding: 0 7px;
        border-radius: 999px;
      }
      section.empty h2 {
        color: var(--muted-foreground);
        font-weight: 550;
      }
      section.empty h2 .none {
        font-weight: 400;
        font-size: 12px;
        margin-left: auto;
      }
      ul.rows {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--border);
      }
      ul.rows li {
        padding: 6px 10px;
        min-width: 0;
      }
      ul.rows li + li {
        border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      }
      ul.rows li:hover {
        background: var(--muted);
      }
      .line1 {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }
      .line1 a {
        display: flex;
        gap: 6px;
        min-width: 0;
        text-decoration: none;
        flex: 1;
      }
      .line1 a:hover .t {
        text-decoration: underline;
      }
      .line1 a.pending {
        opacity: 0.6;
        cursor: progress;
      }
      .num {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--c);
        flex: none;
      }
      .t {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .pill {
        flex: none;
        font-size: 10px;
        padding: 0 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted-foreground);
      }
      .pill.req {
        border-style: dashed;
        color: var(--w-merging);
        border-color: color-mix(in srgb, var(--w-merging) 60%, var(--border));
      }
      .mergebtn {
        flex: none;
        align-self: center;
        margin: -2px 0;
        padding: 1px 10px;
        border-radius: 5px;
        border: 1px solid color-mix(in srgb, var(--w-merging) 55%, var(--border));
        background: color-mix(in srgb, var(--w-merging) 10%, transparent);
        color: var(--foreground);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .mergebtn:hover:not(:disabled) {
        background: color-mix(in srgb, var(--w-merging) 22%, transparent);
      }
      .mergebtn:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .pill.fixreq {
        border-style: dashed;
        color: var(--w-primary);
        border-color: color-mix(in srgb, var(--w-primary) 60%, var(--border));
      }
      .fixbtn {
        flex: none;
        align-self: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        margin: -3px 0;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--w-muted-fg);
        cursor: pointer;
      }
      .fixbtn:hover:not(:disabled) {
        background: color-mix(in srgb, var(--foreground) 10%, transparent);
        color: var(--foreground);
      }
      .fixbtn:disabled {
        cursor: progress;
      }
      .fixbtn svg,
      .fixall svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fixall {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 8px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--foreground);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .fixall:hover:not(:disabled) {
        background: var(--muted);
      }
      .fixall:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .fixall svg {
        width: 12px;
        height: 12px;
      }
      .scope {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        font-size: 12px;
        color: var(--w-muted-fg);
      }
      .scope strong {
        color: var(--foreground);
        font-weight: 600;
      }
      .linkbtn {
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--w-primary);
        font-size: 12px;
        cursor: pointer;
      }
      .linkbtn:hover {
        text-decoration: underline;
      }
      .row-err {
        color: var(--w-destructive);
        font-size: 12px;
        margin-top: 2px;
        overflow-wrap: anywhere;
      }
      .pill.brand {
        color: var(--foreground);
        border-color: color-mix(in srgb, var(--w-primary) 45%, var(--border));
        background: color-mix(in srgb, var(--w-primary) 10%, transparent);
      }
      .line2 {
        color: var(--muted-foreground);
        font-size: 12px;
        margin-top: 1px;
        overflow-wrap: anywhere;
      }
      .line2 .blk {
        color: var(--foreground);
        font-weight: 550;
      }
      .attach {
        flex: none;
        align-self: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        margin: -3px -4px -3px 0;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--w-muted-fg);
        cursor: pointer;
        /* Hidden at rest but keeps its space; shown on row hover, keyboard focus, or while busy/done/failed. */
        opacity: 0;
      }
      ul.rows li:hover .attach,
      ul.rows li:has(:focus-visible) .attach,
      .attach:focus-visible,
      .attach:disabled {
        opacity: 1;
      }
      @media (hover: none) {
        .attach {
          opacity: 1;
        }
      }
      .attach:hover:not(:disabled) {
        background: color-mix(in srgb, var(--foreground) 10%, transparent);
        color: var(--foreground);
      }
      .attach:disabled {
        cursor: progress;
      }
      .attach.done {
        opacity: 1;
        color: var(--w-success);
      }
      .attach.bad {
        opacity: 1;
        color: var(--w-destructive);
      }
      .attach svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .ready {
        --c: var(--w-success);
      }
      .cipending {
        --c: var(--w-attention);
      }
      .blocked {
        --c: var(--w-destructive);
      }
      .merging {
        --c: var(--w-merging);
      }
      .wait {
        --c: var(--w-primary);
      }
      .draft {
        --c: var(--w-muted-fg);
      }
      .mine {
        --c: var(--w-primary);
      }
      .sub,
      .refreshed,
      .line2,
      footer,
      .sep,
      section.empty h2,
      .pill,
      .chip.zero,
      .banner .note,
      .emptystate {
        color: var(--w-muted-fg);
      }
      .inline-err,
      .banner.err strong,
      footer .bad {
        color: var(--w-destructive);
      }

      .emptystate {
        padding: 24px 12px;
        text-align: center;
        color: var(--muted-foreground);
        border: 1px dashed var(--border);
        border-radius: 6px;
      }
      footer {
        color: var(--muted-foreground);
        font-size: 11px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        padding-top: 2px;
      }
      footer .h {
        font-family: var(--font-mono);
      }
      footer .bad {
        color: var(--destructive);
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script>
      (function () {
        var api = globalThis.cakeArtifact;
        var app = document.getElementById("app");
        var state = null;
        var hydrated = false;
        var busy = false;
        var inlineErr = "";
        var openErr = "";
        var openErrTimer = null;
        var pendingOpen = {};
        // Merge button: local view of "/merge" posts. mergeLocal[n] = {kind:"posting"} while the
        // post is in flight, then {kind:"posted", at, refreshedAt} until the next refresh lands.
        var mergeLocal = {};
        var mergeErr = {};
        var mergeErrTimers = {};
        // Fix: asks the PR's project's Project Chat to fix it (backend request_fix). fixLocal[n] =
        // {kind:"sending"} while in flight, then {kind:"requested", at, until, key, project} until
        // the backend's saved fixRequests entry arrives.
        var FIX_GROUPS = ["blocked"];
        var fixLocal = {};
        var fixErr = {};
        var fixErrTimers = {};
        // Project scoping: the project of the chat this window is showing (host navigation context).
        var context = null;
        var showAllFor = null;
        // Composer attach (cake.composer.attach). Hidden when the host does not provide it.
        var attachState = {};
        var attachTimers = {};
        function composerApi() {
          var c = globalThis.cake;
          return c && c.composer && typeof c.composer.attach === "function" ? c.composer : null;
        }

        var SECTIONS = [
          { key: "merging", label: "Merging", cls: "merging" },
          { key: "ready_to_merge", label: "Ready to merge", cls: "ready" },
          { key: "blocked", label: "Blocked", cls: "blocked" },
          { key: "ci_pending", label: "CI pending", cls: "cipending" },
          { key: "waiting_on_review", label: "Waiting on review", cls: "wait" },
          { key: "draft", label: "Draft", cls: "draft" },
          { key: "waiting_on_my_review", label: "Waiting on my review", cls: "mine" },
        ];

        function el(tag, attrs, kids) {
          var e = document.createElement(tag);
          if (attrs)
            for (var k in attrs) {
              var v = attrs[k];
              if (v == null || v === false) continue;
              if (k === "class") e.className = v;
              else if (k === "text") e.textContent = v;
              else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
              else e.setAttribute(k, v === true ? "" : String(v));
            }
          (kids || []).forEach(function (c) {
            if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
          });
          return e;
        }

        function ts(iso) {
          var t = iso ? Date.parse(iso) : NaN;
          return isNaN(t) ? null : t;
        }
        function rel(iso) {
          var t = ts(iso);
          if (t == null) return "never";
          var s = Math.round((Date.now() - t) / 1000);
          if (s < 45) return "just now";
          var m = Math.round(s / 60);
          if (m < 60) return m + "m ago";
          var h = Math.round(m / 60);
          if (h < 36) return h + "h ago";
          var d = Math.round(h / 24);
          return d + "d ago";
        }
        function abs(iso) {
          var t = ts(iso);
          return t == null ? "" : new Date(t).toLocaleString();
        }
        function hm(iso) {
          var t = ts(iso);
          if (t == null) return "?";
          var d = new Date(t);
          return (
            String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0")
          );
        }
        function arr(x) {
          return Array.isArray(x) ? x : [];
        }

        function backendRefreshing() {
          var r = state && state.refreshing;
          var t = r && ts(r.startedAt);
          return t != null && Date.now() - t < 120000;
        }

        function cleanStatus(row) {
          var s = String(row.status || "");
          if (row.imported)
            s = s
              .split(" · ")
              .filter(function (p) {
                return !/^Imported from Meteorite/.test(p);
              })
              .join(" · ");
          return s;
        }

        var SVG_NS = "http://www.w3.org/2000/svg";
        function icon(d) {
          var svg = document.createElementNS(SVG_NS, "svg");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("aria-hidden", "true");
          var p = document.createElementNS(SVG_NS, "path");
          p.setAttribute("d", d);
          svg.appendChild(p);
          return svg;
        }
        var PAPERCLIP =
          "m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l10-10a4 4 0 0 1 5.66 5.66l-10 10a2 2 0 0 1-2.83-2.83l9.19-9.19";
        var CHECK = "m5 12 4 4L19 6";
        var WRENCH =
          "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z";
        var CROSS = "M6 6l12 12M18 6 6 18";

        // A PR in two lanes has a button in each section, so the key names the section too.
        function attachKey(row, secKey) {
          return String(secKey || row.group || "") + ":" + String(row.number);
        }

        function attachButton(row, secKey) {
          if (!composerApi()) return null;
          var key = attachKey(row, secKey);
          var st = attachState[key];
          var label = "Add #" + row.number + " to chat composer";
          var title = st ? st.message : "Add to the current chat's composer (not sent)";
          return el(
            "button",
            {
              type: "button",
              class:
                "attach" +
                (st && st.kind === "ok" ? " done" : st && st.kind === "error" ? " bad" : ""),
              "aria-label": label,
              "data-attach-key": key,
              title: title,
              disabled: st && st.kind === "pending",
              onclick: function (ev) {
                ev.preventDefault();
                ev.stopPropagation();
                attachRow(row, secKey);
              },
            },
            [icon(st && st.kind === "ok" ? CHECK : st && st.kind === "error" ? CROSS : PAPERCLIP)],
          );
        }

        function setAttachState(key, value, clearAfterMs) {
          if (attachTimers[key]) {
            clearTimeout(attachTimers[key]);
            delete attachTimers[key];
          }
          if (value) attachState[key] = value;
          else delete attachState[key];
          if (clearAfterMs)
            attachTimers[key] = setTimeout(function () {
              delete attachTimers[key];
              delete attachState[key];
              render();
            }, clearAfterMs);
          render();
        }

        async function attachRow(row, secKey) {
          var composer = composerApi();
          if (!composer) return;
          var key = attachKey(row, secKey);
          var secName = secKey || row.group;
          if (attachState[key] && attachState[key].kind === "pending") return;
          var n = Number(row.number);
          var title = String(row.title || "(untitled)");
          var label = ("#" + n + " " + title).slice(0, 200);
          var data = {
            repo: "shop/world",
            number: n,
            title: title.slice(0, 500),
            url: row.url || "https://delta.shopify.io/shop/world/pull/" + n,
            section:
              (
                SECTIONS.filter(function (s) {
                  return s.key === secName;
                })[0] || {}
              ).label ||
              secName ||
              null,
            status: cleanStatus(row).slice(0, 500) || null,
            updatedAt: row.updatedAt || null,
          };
          if (row.ownership === "assigned") data.ownership = "assigned to you";
          if (row.author) data.author = String(row.author).slice(0, 100);
          if (row.draft != null) data.draft = !!row.draft;
          setAttachState(key, { kind: "pending", message: "Adding…" });
          var result;
          try {
            result = await composer.attach({ label: label, itemId: String(n), data: data });
          } catch (e) {
            result = { ok: false, error: (e && e.message) || String(e) };
          }
          if (result && result.ok) {
            var where = result.target && result.target.title ? result.target.title : "the chat";
            setAttachState(
              key,
              {
                kind: "ok",
                message: (result.duplicate ? "Already in " : "Added to ") + where + " — not sent",
              },
              2500,
            );
          } else {
            var msg = (result && result.error) || "Unknown error";
            setAttachState(key, { kind: "error", message: msg }, 6000);
            showOpenErr("Couldn't add #" + n + " to the composer: " + msg);
          }
        }

        // A /merge posted from this widget shows the row as Merging (requested) until the next
        // refresh resolves it from Delta / Merge Garden. The saved override comes from the backend.
        function mergeOverride(row) {
          var n = String(row.number);
          var saved = state && state.mergeOverrides && state.mergeOverrides[n];
          if (saved) return { kind: "posted", at: saved.at };
          var local = mergeLocal[n];
          if (local && local.kind === "posting") return local;
          if (
            local &&
            local.kind === "posted" &&
            (state && state.refreshedAt) === local.refreshedAt
          )
            return local;
          return null;
        }

        function canRequestMerge(row) {
          if (row.group !== "ready_to_merge" || mergeOverride(row)) return false;
          if (!api || typeof api.callTool !== "function") return false;
          var until = ts(row.mergeRequestPendingUntil);
          return until == null || Date.now() >= until;
        }

        function setMergeErr(n, msg) {
          if (mergeErrTimers[n]) clearTimeout(mergeErrTimers[n]);
          delete mergeErrTimers[n];
          if (msg == null) {
            delete mergeErr[n];
            return;
          }
          mergeErr[n] = msg;
          mergeErrTimers[n] = setTimeout(function () {
            delete mergeErr[n];
            delete mergeErrTimers[n];
            render();
          }, 20000);
        }

        async function requestMerge(row) {
          var n = String(row.number);
          if (mergeOverride(row)) return; // already posting or posted: never post twice
          setMergeErr(n, null);
          mergeLocal[n] = { kind: "posting" };
          render();
          try {
            var result = await api.callTool("merge_pr", { number: Number(row.number) });
            mergeLocal[n] = {
              kind: "posted",
              at: (result && result.at) || new Date().toISOString(),
              refreshedAt: state && state.refreshedAt,
            };
          } catch (e) {
            delete mergeLocal[n];
            setMergeErr(n, (e && e.message) || String(e));
          }
          render();
        }

        function mergeButton(row) {
          if (!canRequestMerge(row)) return null;
          return el(
            "button",
            {
              type: "button",
              class: "mergebtn",
              "aria-label": "Merge #" + row.number + ": post /merge",
              title:
                "Post /merge as a comment on #" + row.number + " (Merge Garden then queues it)",
              disabled: !!mergeLocal[String(row.number)],
              onclick: function (ev) {
                ev.preventDefault();
                ev.stopPropagation();
                requestMerge(row);
              },
            },
            ["Merge"],
          );
        }

        // ---- Project scope ------------------------------------------------------------------
        function viewedProject() {
          var p = context && context.project;
          return p && p.path ? p : null;
        }
        // Rows carry `projects` once a refresh has read Cake's projects; until then nothing is hidden.
        function scopeProject() {
          var p = viewedProject();
          if (!p || showAllFor === p.path) return null;
          var s = state || {};
          var known = arr(s.authored)
            .concat(arr(s.reviewRequests))
            .some(function (r) {
              return Array.isArray(r.projects);
            });
          return known ? p : null;
        }
        function inProject(row, path) {
          return arr(row.projects).some(function (p) {
            return p && p.path === path;
          });
        }

        // ---- Fix ------------------------------------------------------------------------------
        // Every lane the row is shown in (an unapproved, blocked PR is in Blocked and Waiting on review).
        function effectiveLanes(row) {
          if (mergeOverride(row)) return ["merging"];
          return Array.isArray(row.lanes) && row.lanes.length ? row.lanes : [row.group];
        }
        function fixTarget(row) {
          var owners = arr(row.projects);
          var viewed = viewedProject();
          var here =
            viewed &&
            owners.filter(function (p) {
              return p && p.path === viewed.path;
            })[0];
          return here || owners[0] || null;
        }
        function fixStatus(row) {
          var n = String(row.number);
          var local = fixLocal[n];
          if (local && local.kind === "sending") return local;
          var saved = state && state.fixRequests && state.fixRequests[n];
          var now = Date.now();
          if (saved && saved.key === row.fixKey && row.fixKey && now < (ts(saved.until) || 0))
            return { kind: "requested", at: saved.at, project: saved.project };
          if (
            local &&
            local.kind === "requested" &&
            local.key === row.fixKey &&
            now < (ts(local.until) || 0)
          )
            return local;
          return null;
        }
        function canFix(row) {
          if (!api || typeof api.callTool !== "function") return false;
          var fixable = effectiveLanes(row).some(function (l) {
            return FIX_GROUPS.indexOf(l) >= 0;
          });
          if (!fixable) return false;
          return !!fixTarget(row) && !fixStatus(row);
        }
        function setFixErr(n, msg) {
          if (fixErrTimers[n]) clearTimeout(fixErrTimers[n]);
          delete fixErrTimers[n];
          if (msg == null) {
            delete fixErr[n];
            return;
          }
          fixErr[n] = msg;
          fixErrTimers[n] = setTimeout(function () {
            delete fixErr[n];
            delete fixErrTimers[n];
            render();
          }, 20000);
        }

        // One backend call; it sends one message per project and reports each PR's outcome.
        async function sendFix(rows, source) {
          var todo = rows.filter(canFix);
          if (!todo.length) return;
          var byNumber = {};
          todo.forEach(function (r) {
            var n = String(r.number);
            byNumber[n] = r;
            setFixErr(n, null);
            fixLocal[n] = { kind: "sending", project: fixTarget(r) };
          });
          render();
          var viewed = viewedProject();
          var input = {
            numbers: todo.map(function (r) {
              return Number(r.number);
            }),
            source: source,
          };
          if (viewed) input.projectPath = viewed.path;
          var result;
          try {
            result = await api.callTool("request_fix", input);
          } catch (e) {
            var msg = (e && e.message) || String(e);
            result = {
              requested: [],
              skipped: [],
              failed: todo.map(function (r) {
                return { number: r.number, error: msg };
              }),
            };
          }
          arr(result && result.requested).forEach(function (q) {
            var r = byNumber[String(q.number)];
            fixLocal[String(q.number)] = {
              kind: "requested",
              at: q.at,
              until: q.until,
              project: q.project,
              key: r ? r.fixKey : null,
            };
          });
          arr(result && result.failed).forEach(function (f) {
            delete fixLocal[String(f.number)];
            setFixErr(String(f.number), String(f.error || "Unknown error"));
          });
          arr(result && result.skipped).forEach(function (s) {
            delete fixLocal[String(s.number)];
            // Already sent or being sent: the saved request shows it. Anything else is news.
            if (s.code !== "requested" && s.code !== "sending")
              setFixErr(String(s.number), "Not sent: " + String(s.reason || s.code));
          });
          // Anything the backend did not mention is restored rather than left "sending".
          Object.keys(byNumber).forEach(function (n) {
            if (fixLocal[n] && fixLocal[n].kind === "sending") delete fixLocal[n];
          });
          render();
        }

        function fixButton(row) {
          var st = fixStatus(row);
          if (st && st.kind === "sending")
            return el(
              "button",
              {
                type: "button",
                class: "fixbtn",
                disabled: true,
                "aria-label": "Sending Fix for #" + row.number,
                title: "Sending…",
              },
              [el("span", { class: "spin", "aria-hidden": "true" })],
            );
          if (!canFix(row)) return null;
          var target = fixTarget(row);
          return el(
            "button",
            {
              type: "button",
              class: "fixbtn",
              "aria-label": "Fix #" + row.number + ": ask the " + target.name + " chat",
              title: "Ask the " + target.name + " Project Chat to fix #" + row.number,
              onclick: function (ev) {
                ev.preventDefault();
                ev.stopPropagation();
                sendFix([row], "row");
              },
            },
            [icon(WRENCH)],
          );
        }

        function fixAllButton(sec, rows) {
          if (FIX_GROUPS.indexOf(sec.key) < 0) return null;
          var sending = rows.some(function (r) {
            var st = fixStatus(r);
            return st && st.kind === "sending";
          });
          var todo = rows.filter(canFix);
          if (!todo.length && !sending) return null;
          return el(
            "button",
            {
              type: "button",
              class: "fixall",
              disabled: sending && !todo.length,
              "aria-label":
                "Fix all in " +
                sec.label +
                ": " +
                todo.length +
                " PR" +
                (todo.length === 1 ? "" : "s"),
              title: "Ask each PR's Project Chat to fix the " + todo.length + " PRs shown here",
              onclick: function (ev) {
                ev.preventDefault();
                sendFix(todo, "fix_all");
              },
            },
            [icon(WRENCH), "Fix all"],
          );
        }

        // Status line: the "Blocked: …" part is emphasized; the time is the PR's last update on Delta.
        function line2Kids(row) {
          var parts = cleanStatus(row)
            .split(" · ")
            .filter(function (p) {
              return p;
            });
          var override = mergeOverride(row);
          if (override)
            parts.unshift(
              override.kind === "posting"
                ? "Merging: posting /merge…"
                : "Merging: /merge posted " + rel(override.at) + ", confirmed on next refresh",
            );
          var fix = fixStatus(row);
          var fixName = fix && fix.project && fix.project.name ? fix.project.name : "project";
          if (fix)
            parts.unshift(
              fix.kind === "sending"
                ? "Fix: asking the " + fixName + " chat…"
                : "Fix: asked the " + fixName + " chat " + rel(fix.at),
            );
          if (row.updatedAt) parts.push("Updated " + rel(row.updatedAt));
          var kids = [];
          parts.forEach(function (p, i) {
            if (i) kids.push(" · ");
            kids.push(
              /^(Blocked|Merging|Fix): /.test(p) ? el("span", { class: "blk", text: p }) : p,
            );
          });
          return kids;
        }

        function rowEl(row, secKey) {
          var brand =
            row.ownership === "assigned" && row.authorBrand ? String(row.authorBrand) : "";
          var url =
            "https://delta.shopify.io/shop/world/pull/" + encodeURIComponent(String(row.number));
          return el("li", null, [
            el("div", { class: "line1" }, [
              el(
                "a",
                {
                  href: url,
                  "data-pr": String(row.number),
                  class: pendingOpen[Number(row.number)] ? "pending" : null,
                  "aria-busy": pendingOpen[Number(row.number)] ? "true" : null,
                  title: "#" + row.number + " " + (row.title || ""),
                },
                [
                  el("span", { class: "num", text: "#" + row.number }),
                  el("span", { class: "t", text: row.title || "(untitled)" }),
                ],
              ),
              row.imported
                ? el("span", {
                    class: "pill",
                    title: "Imported from Meteorite (read-only)",
                    text: "imported",
                  })
                : null,
              brand
                ? el("span", {
                    class: "pill brand",
                    title: "Authored by " + brand + ", assigned to you",
                    text: brand,
                  })
                : null,
              mergeOverride(row)
                ? el("span", {
                    class: "pill req",
                    title: "Requested from this widget; Merge Garden has not confirmed it yet",
                    text: "requested",
                  })
                : null,
              fixStatus(row) && fixStatus(row).kind === "requested"
                ? el("span", {
                    class: "pill fixreq",
                    title: "Fix sent to the Project Chat from this widget",
                    text: "fix requested",
                  })
                : null,
              mergeButton(row),
              fixButton(row),
              attachButton(row, secKey),
            ]),
            el(
              "div",
              {
                class: "line2",
                title: row.updatedAt ? "Last updated on Delta: " + abs(row.updatedAt) : null,
              },
              line2Kids(row),
            ),
            mergeErr[String(row.number)]
              ? el("div", {
                  class: "row-err",
                  role: "alert",
                  text: "Couldn't post /merge: " + mergeErr[String(row.number)],
                })
              : null,
            fixErr[String(row.number)]
              ? el("div", {
                  class: "row-err",
                  role: "alert",
                  text: "Couldn't send Fix: " + fixErr[String(row.number)],
                })
              : null,
          ]);
        }

        function onRefresh() {
          if (busy) return;
          inlineErr = "";
          if (!api || typeof api.callTool !== "function") {
            inlineErr = "Refresh unavailable: no artifact backend in this view.";
            render();
            return;
          }
          busy = true;
          render();
          Promise.resolve()
            .then(function () {
              return api.callTool("refresh", { source: "view" });
            })
            .catch(function (e) {
              inlineErr = (e && e.message) || String(e);
            })
            .then(function () {
              busy = false;
              render();
            });
        }

        function render() {
          var s = state || {};
          var allAuthored = arr(s.authored);
          var allReviews = arr(s.reviewRequests);
          var scope = scopeProject();
          var keep = function (r) {
            return !scope || inProject(r, scope.path);
          };
          var authored = allAuthored.filter(keep);
          var reviews = allReviews.filter(keep);
          var groups = {};
          SECTIONS.forEach(function (sec) {
            groups[sec.key] = [];
          });
          authored.forEach(function (r) {
            effectiveLanes(r).forEach(function (g) {
              (groups[g] || (groups[g] = [])).push(r);
            });
          });
          groups.waiting_on_my_review = reviews;

          var running = busy || backendRefreshing();
          var me = s.me && s.me.login ? "@" + s.me.login : "";
          var focusedRefresh =
            document.activeElement && document.activeElement.id === "refresh-btn";
          var focusedAttach =
            document.activeElement && document.activeElement.getAttribute
              ? document.activeElement.getAttribute("data-attach-key")
              : null;

          var nodes = [];
          nodes.push(
            el("header", null, [
              el("div", { class: "ttl" }, [
                el("h1", { text: "Delta PRs" }),
                el("span", { class: "sub", text: "shop/world" + (me ? " · " + me : "") }),
              ]),
              el("div", { class: "actions" }, [
                el("span", {
                  class: "refreshed",
                  title: s.refreshedAt ? "Last pulled from Delta: " + abs(s.refreshedAt) : null,
                  text: s.refreshedAt ? "Pulled " + rel(s.refreshedAt) : "Never pulled",
                }),
                el(
                  "button",
                  {
                    id: "refresh-btn",
                    class: "btn",
                    type: "button",
                    disabled: running,
                    "aria-busy": running ? "true" : null,
                    onclick: onRefresh,
                  },
                  running
                    ? [el("span", { class: "spin", "aria-hidden": "true" }), "Refreshing…"]
                    : ["Refresh"],
                ),
                inlineErr
                  ? el("span", { class: "inline-err", role: "alert", text: inlineErr })
                  : null,
                openErr ? el("span", { class: "inline-err", role: "alert", text: openErr }) : null,
              ]),
            ]),
          );

          var le = s.lastError;
          if (
            le &&
            le.message &&
            (ts(s.refreshedAt) == null || (ts(le.at) || 0) > ts(s.refreshedAt))
          ) {
            nodes.push(
              el("div", { class: "banner err", role: "alert" }, [
                el("div", null, [
                  el("strong", {
                    text:
                      "Last refresh failed " +
                      rel(le.at) +
                      (le.source ? " (" + le.source + ")" : "") +
                      ": ",
                  }),
                  String(le.message),
                ]),
                el("div", {
                  class: "note",
                  text: s.refreshedAt
                    ? "PRs below are from the last successful pull, " + rel(s.refreshedAt) + "."
                    : "No successful refresh yet.",
                }),
              ]),
            );
          }
          var warns = arr(s.warnings);
          if (warns.length)
            nodes.push(
              el("div", { class: "banner warn" }, [
                el(
                  "ul",
                  null,
                  warns.map(function (w) {
                    return el("li", { text: String(w) });
                  }),
                ),
              ]),
            );

          var viewed = viewedProject();
          var total = allAuthored.length + allReviews.length;
          if (hydrated && viewed && (scope || showAllFor === viewed.path)) {
            nodes.push(
              el(
                "div",
                { class: "scope" },
                scope
                  ? [
                      el("span", null, [
                        el("strong", { text: scope.name }),
                        " · " + (authored.length + reviews.length) + " of " + total + " PRs",
                      ]),
                      el("button", {
                        type: "button",
                        class: "linkbtn",
                        text: "Show all projects",
                        onclick: function () {
                          showAllFor = viewed.path;
                          render();
                        },
                      }),
                    ]
                  : [
                      el("span", null, [
                        el("strong", { text: "All projects" }),
                        " · " + total + " PRs",
                      ]),
                      el("button", {
                        type: "button",
                        class: "linkbtn",
                        text: "Only " + viewed.name,
                        onclick: function () {
                          showAllFor = null;
                          render();
                        },
                      }),
                    ],
              ),
            );
          }

          if (!hydrated) {
            nodes.push(el("div", { class: "emptystate", text: "Loading…" }));
          } else if (!s.refreshedAt && !allAuthored.length && !allReviews.length) {
            nodes.push(el("div", { class: "emptystate", text: "Not pulled yet — press Refresh." }));
          } else {
            nodes.push(
              el(
                "nav",
                { class: "chips", "aria-label": "Sections" },
                SECTIONS.map(function (sec) {
                  var n = groups[sec.key].length;
                  return el(
                    "button",
                    {
                      type: "button",
                      class: "chip " + sec.cls + (n ? "" : " zero"),
                      onclick: function () {
                        var t = document.getElementById("sec-" + sec.key);
                        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
                      },
                    },
                    [
                      el("span", { class: "dot", "aria-hidden": "true" }),
                      sec.label,
                      el("span", { class: "n", text: String(n) }),
                    ],
                  );
                }),
              ),
            );
            SECTIONS.forEach(function (sec) {
              if (sec.key === "waiting_on_my_review")
                nodes.push(el("div", { class: "sep", text: "Reviews requested from you" }));
              var rows = groups[sec.key];
              var head = el("h2", null, [
                sec.label,
                el("span", { class: "n", text: String(rows.length) }),
                rows.length ? null : el("span", { class: "none", text: "Nothing here" }),
                rows.length ? fixAllButton(sec, rows) : null,
              ]);
              nodes.push(
                el(
                  "section",
                  {
                    id: "sec-" + sec.key,
                    class: sec.cls + (rows.length ? "" : " empty"),
                    "aria-label": sec.label,
                  },
                  [
                    head,
                    rows.length
                      ? el(
                          "ul",
                          { class: "rows" },
                          rows.map(function (r) {
                            return rowEl(r, sec.key);
                          }),
                        )
                      : null,
                  ],
                ),
              );
            });
          }

          var hist = arr(s.history).slice(0, 3);
          nodes.push(
            el(
              "footer",
              null,
              [
                el("span", { text: "Auto-refreshes every 15 min · links open in your browser" }),
              ].concat(
                hist.map(function (h) {
                  var dur =
                    typeof h.durationMs === "number"
                      ? " · " + (h.durationMs / 1000).toFixed(1) + " s"
                      : "";
                  return el("span", {
                    class: "h" + (h.ok ? "" : " bad"),
                    title: abs(h.at),
                    text:
                      hm(h.at) +
                      " · " +
                      (h.source || "?") +
                      " · " +
                      (h.ok ? "ok" : "failed: " + String(h.error || "").slice(0, 80)) +
                      dur,
                  });
                }),
              ),
            ),
          );

          app.replaceChildren.apply(app, nodes);
          if (focusedRefresh) {
            var b = document.getElementById("refresh-btn");
            if (b) b.focus();
          }
          if (focusedAttach) {
            var again = Array.prototype.find.call(
              app.querySelectorAll("button[data-attach-key]"),
              function (x) {
                return x.getAttribute("data-attach-key") === focusedAttach;
              },
            );
            if (again) again.focus();
          }
        }

        function take(snap) {
          if (!snap) return;
          if (snap.hydrated === false) return;
          hydrated = true;
          state = snap.value && typeof snap.value === "object" ? snap.value : null;
          render();
        }

        async function start() {
          render();
          if (!api) {
            hydrated = true;
            inlineErr = "Artifact state is unavailable in this view.";
            render();
            return;
          }
          try {
            var r = await api.read();
            hydrated = true;
            state = r && r.value && typeof r.value === "object" ? r.value : null;
            render();
          } catch (e) {
            hydrated = true;
            inlineErr = "Could not read state: " + ((e && e.message) || e);
            render();
          }
          try {
            take(api.getSnapshot());
          } catch (e) {}
          watchContext();
          try {
            api.subscribe(function () {
              try {
                take(api.getSnapshot());
              } catch (e) {}
            });
          } catch (e) {}
        }

        // Follows the chat this window shows; switching projects re-applies the scope.
        function watchContext() {
          if (typeof api.getContext !== "function") return;
          var apply = function (next) {
            var before = viewedProject();
            context = next || null;
            var after = viewedProject();
            if ((before && before.path) !== (after && after.path)) showAllFor = null;
            render();
          };
          try {
            apply(api.getContext());
          } catch (e) {}
          try {
            if (typeof api.subscribeContext === "function") api.subscribeContext(apply);
          } catch (e) {}
        }

        function showOpenErr(msg) {
          openErr = msg;
          if (openErrTimer) clearTimeout(openErrTimer);
          openErrTimer = setTimeout(function () {
            openErr = "";
            openErrTimer = null;
            render();
          }, 8000);
          render();
        }

        async function openPr(n) {
          var url = "https://delta.shopify.io/shop/world/pull/" + n;
          if (pendingOpen[n]) return;
          if (!api || typeof api.callTool !== "function") {
            showOpenErr(
              "Couldn't open #" + n + ": no artifact backend in this view. Copy the link: " + url,
            );
            return;
          }
          pendingOpen[n] = true;
          render();
          try {
            await api.callTool("open_pr", { number: n });
          } catch (e) {
            delete pendingOpen[n];
            showOpenErr(
              "Couldn't open #" +
                n +
                ": " +
                ((e && e.message) || String(e)) +
                ". Copy the link: " +
                url,
            );
            return;
          }
          delete pendingOpen[n];
          render();
        }

        function onLinkClick(ev) {
          var a = ev.target && ev.target.closest ? ev.target.closest("a[data-pr]") : null;
          if (!a || !app.contains(a)) return;
          if (ev.type === "auxclick" && ev.button !== 1) return;
          ev.preventDefault();
          var n = Number(a.getAttribute("data-pr"));
          if (!Number.isInteger(n) || n <= 0) return;
          openPr(n);
        }
        app.addEventListener("click", onLinkClick);
        app.addEventListener("auxclick", onLinkClick);

        setInterval(function () {
          if (!document.hidden) render();
        }, 30000);
        start();
      })();
    </script>
  </body>
</html>
